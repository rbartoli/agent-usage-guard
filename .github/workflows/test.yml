name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.16.0
      - name: Lint
        run: ruff check agent-usage-guard.py agent-usage-guard.test.py mutation-smoke.py demo/run_demo.py demo/fixture/northstar-api/src
      - name: Format
        run: ruff format --check agent-usage-guard.py agent-usage-guard.test.py mutation-smoke.py demo/run_demo.py demo/fixture/northstar-api/src
      - name: Demo CLI check
        run: python demo/run_demo.py --help
      - name: Validate JSON manifests
        run: |
          for file in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json examples/settings-hooks.json demo/empty-mcp.json; do
            python -m json.tool "$file" >/dev/null
          done
      - name: Validate Claude plugin contract
        run: npx --yes @anthropic-ai/claude-code@2.1.220 plugin validate . --strict

  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install coverage tooling
        if: matrix.python-version == '3.14'
        run: python -m pip install coverage==7.10.6
      - name: Compile
        run: python -m py_compile agent-usage-guard.py agent-usage-guard.test.py mutation-smoke.py demo/run_demo.py demo/fixture/northstar-api/src/auth.py demo/fixture/northstar-api/src/database.py
      - name: Test
        if: matrix.python-version != '3.14'
        run: python agent-usage-guard.test.py
      - name: Test with branch coverage
        if: matrix.python-version == '3.14'
        run: |
          coverage run agent-usage-guard.test.py
          coverage combine --quiet
          coverage report --include='*/agent-usage-guard.py,*/demo/run_demo.py'
      - name: Mutation smoke test
        if: matrix.python-version == '3.14'
        run: python mutation-smoke.py
