name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The Claude Code release the mod is validated and tested against. Raise it
  # with the README's "checked against" version.
  CLAUDE_CODE: "@anthropic-ai/claude-code@2.1.295"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install --global "$CLAUDE_CODE"
      - name: Validate the plugin and its hooks module
        run: claude plugin validate . --strict
      - name: Run the mod test suite
        run: claude plugin test
      - name: Check JSON manifests
        run: |
          for file in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json demo/empty-mcp.json tsconfig.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done
      - name: Check the demo launcher
        run: |
          bash -n demo/run-demo.sh
          shellcheck demo/run-demo.sh
